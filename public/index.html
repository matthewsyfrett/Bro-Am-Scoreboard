<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5132">
<title>Bro-Am Live Golf</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f3f6f4;color:#17221b}
header{background:#0f5132;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}.wrap{max-width:1050px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px}.brand{font-size:28px;font-weight:900}.sub{font-size:13px;opacity:.82}.live{font-size:12px;border:1px solid #ffffff44;border-radius:99px;padding:7px 9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6cff9a;margin-right:5px}
.tabs{display:flex;gap:8px;overflow:auto;margin-top:14px}.tabs button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;background:#ffffff22;color:#fff}.tabs button.active{background:#fff;color:#0f5132}
main{padding:16px}.card{background:#fff;border:1px solid #dfe6e2;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #0000000a}h2,h3{margin-top:0}
table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid #e4e9e6;text-align:left}th:last-child,td:last-child{text-align:right}.net{font-size:18px;font-weight:900;color:#0f5132}.muted{color:#6b766f;font-size:13px}
.rounds{display:flex;flex-wrap:wrap;gap:6px}.rounds button,.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;background:#e9efeb;color:#0f5132}.rounds button.active,.primary{background:#0f5132;color:#fff}
.scroll{overflow:auto}.score{min-width:760px}.score input{width:38px;padding:7px 4px;text-align:center;border:1px solid #cfd8d3;border-radius:7px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:800;color:#6b766f;margin-bottom:4px}.field input,.field select{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cfd8d3;border-radius:8px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{background:#f7f2df;color:#604d16;border-radius:9px;padding:10px;font-size:13px;margin-top:10px}.empty{text-align:center;color:#6b766f;padding:20px}
@media(max-width:700px){.teams{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><div><div class="brand" id="tripNameHead">Bro-Am Live Golf</div><div class="sub">8 golfers · 3 days · all scoring net</div></div><div class="live"><span class="dot"></span>LIVE</div></div>
<div class="tabs"><button data-view="board" class="active">Leaderboard</button><button data-view="scores">Enter Scores</button><button data-view="setup">Trip Setup</button></div>
</div></header>
<main class="wrap"><section id="board"></section><section id="scores" hidden></section><section id="setup" hidden></section></main>
<script>
var trip=null,view="board",game="bestball";
function dayCourse(day){return trip.courses&&trip.courses[day]||{name:"",par:Array(18).fill(4),strokeIndex:Array.from({length:18},function(_,i){return i+1})}}
function normalizeTrip(x){
  x=x||{};
  var defaultPar=Array(18).fill(4),defaultSI=Array.from({length:18},function(_,i){return i+1});
  x.courses=x.courses||{};
  ["day1","day2","day3"].forEach(function(day){
    var oldPar=Array.isArray(x.holePar)?x.holePar:defaultPar;
    var oldSI=Array.isArray(x.holeStrokeIndex)?x.holeStrokeIndex:defaultSI;
    x.courses[day]=x.courses[day]||{};
    x.courses[day].name=x.courses[day].name||"";
    x.courses[day].par=Array.isArray(x.courses[day].par)?x.courses[day].par:oldPar.slice();
    x.courses[day].strokeIndex=Array.isArray(x.courses[day].strokeIndex)?x.courses[day].strokeIndex:oldSI.slice();
  });
  (x.players||[]).forEach(function(p){
    p.courseHandicap=p.courseHandicap||{};
    ["day1","day2","day3"].forEach(function(day){
      if(p.courseHandicap[day]==null)p.courseHandicap[day]=Math.round(Number(p.handicap)||0);
    });
  });
  x.holePar=x.courses.day1.par.slice();
  x.holeStrokeIndex=x.courses.day1.strokeIndex.slice();
  return x;
}

var gameNames={bestball:"Day 1 · Best Ball",individual1:"Day 1 · Individual",scramble:"Day 2 · Scramble",individual3:"Day 3 · Individual"};
function blank(){return Array(18).fill(null)}
function player(id){return trip.players.find(function(p){return p.id===id})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function courseKeyForGame(g){return g==="bestball"||g==="individual1"?"day1":g==="scramble"?"day2":"day3"}
function playerCourseHcp(id,day){var p=player(id);return Number(p&&p.courseHandicap&&p.courseHandicap[day]!=null?p.courseHandicap[day]:p&&p.handicap)||0}
function strokesOnHole(hcp,i,day){var hc=Math.round(Math.max(0,Number(hcp)||0)),si=Number(dayCourse(day).strokeIndex[i]||i+1),base=Math.floor(hc/18),extra=hc%18;return base+(si<=extra?1:0)}
function netScore(gross,hcp,i,day){return Number(gross)-strokesOnHole(hcp,i,day)}
function individualTotal(id,g){var day=courseKeyForGame(g),a=(trip.scores[g]&&trip.scores[g][id])||blank();if(!a.some(function(v){return v!=null}))return null;var total=0;for(var i=0;i<18;i++){if(a[i]!=null)total+=netScore(a[i],playerCourseHcp(id,day),i,day)}return total}
function bestBallTotal(team,i){var total=0;for(var h=0;h<18;h++){var best=null;for(var j=0;j<team.length;j++){var id=team[j],a=(trip.scores.bestball&&trip.scores.bestball["team"+(i+1)+"_"+id])||blank(),v=a[h];if(v!=null){var n=netScore(v,playerCourseHcp(id,"day1"),h,"day1");if(best===null||n<best)best=n}}if(best===null)return null;total+=best}return total}
function scrambleHcp(team){var hs=team.map(function(id){return playerCourseHcp(id,"day2")}).sort(function(a,b){return a-b});var low=(trip.scrambleHandicap&&trip.scrambleHandicap.lowerPct)||35,high=(trip.scrambleHandicap&&trip.scrambleHandicap.higherPct)||15;return Math.round(hs[0]*low/100+hs[1]*high/100)}
function scrambleTotal(team,i){var a=(trip.scores.scramble&&trip.scores.scramble["team"+(i+1)])||blank();if(!a.some(function(v){return v!=null}))return null;var hcp=scrambleHcp(team),total=0;for(var h=0;h<18;h++){if(a[h]!=null)total+=netScore(a[h],hcp,h,"day2")}return total}
function day2HolePoints(diff){if(diff<=-2)return 3;if(diff===-1)return 2;if(diff===0)return 1;if(diff===1)return -1;return -2}
function scramblePointsTotal(team,i){var a=(trip.scores.scramble&&trip.scores.scramble["team"+(i+1)])||blank(),hcp=scrambleHcp(team),course=dayCourse("day2"),total=0,any=false;for(var h=0;h<18;h++){if(a[h]==null)continue;any=true;var par=Number(course.par[h]||4),ns=netScore(a[h],hcp,h,"day2");total+=day2HolePoints(ns-par)}return any?total:null}
function day3HolePoints(diff){if(diff<=-2)return 4;if(diff===-1)return 3;if(diff===0)return 2;if(diff===1)return 1;return 0}
function individualPointsTotal(id){var a=(trip.scores.individual3&&trip.scores.individual3[id])||blank(),total=0,any=false,course=dayCourse("day3");for(var h=0;h<18;h++){if(a[h]==null)continue;any=true;var par=Number(course.par[h]||4),ns=netScore(a[h],playerCourseHcp(id,"day3"),h,"day3");total+=day3HolePoints(ns-par)}return any?total:null}
function leaderRows(g){var day=courseKeyForGame(g),rows=[];if(g==="individual1"){rows=trip.players.map(function(p){return {id:p.id,name:p.name,h:playerCourseHcp(p.id,day),score:individualTotal(p.id,g)}})}else if(g==="individual3"){rows=trip.players.map(function(p){return {id:p.id,name:p.name,h:playerCourseHcp(p.id,day),score:individualTotal(p.id,g),points:individualPointsTotal(p.id)}})}else{var ts=trip.teams[g==="bestball"?"bestball":"scramble"];rows=ts.map(function(t,i){return {team:t,name:t.map(function(id){return player(id).name}).join(" / "),score:g==="bestball"?bestBallTotal(t,i):scrambleTotal(t,i),points:g==="scramble"?scramblePointsTotal(t,i):null}})}return rows}
function placementPoints(g,i){if(g==="bestball")return [10,8,6,4][i]||0;if(g==="individual1")return [14,12,10,8,6,4,2,0][i]||0;return 0}
function overallRows(){var out=trip.players.map(function(p){return {id:p.id,name:p.name,points:0}}),m={};out.forEach(function(x){m[x.id]=x});
var b=leaderRows("bestball"),bDone=b.every(function(r){return r.score!=null});if(bDone)b.slice().sort(function(a,c){return a.score-c.score}).forEach(function(r,i){r.team.forEach(function(id){m[id].points+=placementPoints("bestball",i)})});
var i1=leaderRows("individual1"),iDone=i1.every(function(r){return r.score!=null});if(iDone)i1.slice().sort(function(a,c){return a.score-c.score}).forEach(function(r,i){m[r.id].points+=placementPoints("individual1",i)});
leaderRows("scramble").forEach(function(r){if(r.points!=null)r.team.forEach(function(id){m[id].points+=r.points})});
leaderRows("individual3").forEach(function(r){if(r.points!=null)m[r.id].points+=r.points});
return out.sort(function(a,b){return b.points-a.points||a.name.localeCompare(b.name)})}
function renderBoard(){var out="<div class='card'><h2>Overall Trip Points</h2><div class='muted'>Day 1 placement points and Day 2/Day 3 hole points update as scores are entered.</div><table><tr><th>#</th><th>Golfer</th><th>Points</th></tr>";overallRows().forEach(function(r,i){out+="<tr><td>"+(i+1)+"</td><td><b>"+esc(r.name)+"</b></td><td class='net'>"+r.points+"</td></tr>"});out+="</table></div>";
Object.keys(gameNames).forEach(function(g){var rows=leaderRows(g),has=rows.some(function(r){return r.score!=null||r.points!=null});var done=rows.every(function(r){return r.score!=null});var isScr=g==="scramble",isD3=g==="individual3";
if(isScr||isD3)rows.sort(function(a,b){return (b.points==null?-999:b.points)-(a.points==null?-999:a.points)});else rows.sort(function(a,b){return (a.score==null?999:a.score)-(b.score==null?999:b.score)});
var ptsText=g==="bestball"?"1st 10 · 2nd 8 · 3rd 6 · 4th 4":g==="individual1"?"14 / 12 / 10 / 8 / 6 / 4 / 2 / 0":isScr?"Eagle 3 · Birdie 2 · Par 1 · Bogey −1 · Double Bogey −2":isD3?"Eagle 4 · Birdie 3 · Par 2 · Bogey 1 · Double Bogey or worse 0":"";
out+="<div class='card'><h2>"+gameNames[g]+"</h2><div class='muted'>Course: "+esc(dayCourse(courseKeyForGame(g)).name||"Not set")+" · Net scoring · "+ptsText+"</div>";
if(!has){out+="<div class='empty'>No scores entered yet.</div>"}else{out+="<table><tr><th>#</th><th>Player / Team</th><th>Net</th><th>Points</th></tr>";rows.forEach(function(r,i){var pts=(isScr||isD3)?r.points:(done?placementPoints(g,i):null);out+="<tr><td>"+(i+1)+"</td><td><b>"+esc(r.name)+"</b>"+(r.h==null?"":" · HCP "+r.h)+"</td><td class='net'>"+(r.score==null?"—":r.score)+"</td><td class='net'>"+(pts==null?"—":pts)+"</td></tr>"});out+="</table>";
if(isScr)out+="<div class='notice'>Day 2 points are summed hole-by-hole from each team's net score versus par and credited to both golfers.</div>";
if(isD3)out+="<div class='notice'>Day 3 points are summed hole-by-hole from each golfer's net score versus par. Double bogey or worse earns 0.</div>";
if((g==="bestball"||g==="individual1")&&!done)out+="<div class='notice'>Placement points lock in after the full game is completed.</div>"}out+="</div>"});document.getElementById("board").innerHTML=out}
function scoreRow(key,label,g){var a=(trip.scores[g]&&trip.scores[g][key])||blank(),out="<div class='card'><h3>"+esc(label)+"</h3><div class='scroll'><table class='score'><tr><th>Gross</th>";trip.holes.forEach(function(h){out+="<th>"+h+"</th>"});out+="</tr><tr><td>Score</td>";trip.holes.forEach(function(h,i){out+="<td><input type='number' min='1' max='20' inputmode='numeric' data-g='"+g+"' data-k='"+key+"' data-i='"+i+"' value='"+(a[i]==null?"":a[i])+"'></td>"});out+="</tr></table></div></div>";return out}
function renderScores(){var dayForScore=courseKeyForGame(game), out="<div class='card'><h2>Enter Scores</h2><div class='muted'>Course: "+esc(dayCourse(dayForScore).name||"Not set")+"</div><div class='rounds' style='margin-top:10px'>";Object.keys(gameNames).forEach(function(g){out+="<button class='"+(g===game?"active":"")+"' data-game='"+g+"'>"+gameNames[g]+"</button>"});out+="</div><div class='muted' style='margin-top:8px'>Enter gross scores. Net scores and points update live.</div></div>";
if(game==="individual1"||game==="individual3"){trip.players.forEach(function(p){out+=scoreRow(p.id,p.name+" · Course HCP "+playerCourseHcp(p.id,dayForScore),game)})}
else if(game==="bestball"){trip.teams.bestball.forEach(function(t,i){out+="<div class='card'><h3>Team "+(i+1)+" · "+esc(t.map(function(id){return player(id).name}).join(" / "))+"</h3>";t.forEach(function(id){out+=scoreRow("team"+(i+1)+"_"+id,player(id).name+" · Course HCP "+playerCourseHcp(id,"day1"),"bestball")});out+="</div>"})}
else{trip.teams.scramble.forEach(function(t,i){out+="<div class='card'><h3>Team "+(i+1)+" · "+esc(t.map(function(id){return player(id).name}).join(" / "))+" · Team HCP "+scrambleHcp(t)+"</h3>"+scoreRow("team"+(i+1),t.map(function(id){return player(id).name}).join(" / "),"scramble")+"</div>"})}
document.getElementById("scores").innerHTML=out;document.querySelectorAll("#scores .rounds button").forEach(function(b){b.onclick=function(){game=b.dataset.game;render()}});document.querySelectorAll("#scores input[data-i]").forEach(function(el){el.onchange=function(){var g=el.dataset.g,k=el.dataset.k,i=Number(el.dataset.i);trip.scores[g]=trip.scores[g]||{};var a=trip.scores[g][k]||blank();a[i]=el.value===""?null:Number(el.value);save("/api/scores",{game:g,key:k,holes:a})}})}
function teamEditor(kind){var out="<div class='teams'>";trip.teams[kind].forEach(function(t,i){out+="<div class='card'><b>Team "+(i+1)+"</b><div class='formgrid'>";[0,1].forEach(function(j){out+="<div class='field'><label>Golfer "+(j+1)+"</label><select data-team='"+kind+"' data-i='"+i+"' data-j='"+j+"'>"+trip.players.map(function(p){return "<option value='"+p.id+"' "+(p.id===t[j]?"selected":"")+">"+esc(p.name)+"</option>"}).join("")+"</select></div>"});out+="</div></div>"});return out+"</div><button class='btn' data-save-team='"+kind+"'>Save Teams</button>"}
function renderSetup(){
var out="<div class='card'><h2>Trip Setup</h2><div class='field'><label>Trip name</label><input id='tn' value='"+esc(trip.tripName)+"'></div><button class='btn primary' id='saveTripName' style='margin-top:12px'>Save Trip Name</button></div>";
out+="<div class='card'><h3>Golfers & Base Handicap Index</h3><div class='muted'>The base Handicap Index is your golfer's index. Enter a separate course handicap for each of the three courses below.</div><div class='formgrid'>";
trip.players.forEach(function(p){out+="<div class='field'><label>Name</label><input data-name='"+p.id+"' value='"+esc(p.name)+"'></div><div class='field'><label>Handicap Index</label><input data-hidx='"+p.id+"' type='number' step='.1' value='"+p.handicap+"'></div>"});out+="</div><button class='btn' id='saveGolfers' style='margin-top:12px'>Save Golfers</button></div>";
["day1","day2","day3"].forEach(function(day,di){
  var course=dayCourse(day), title="Day "+(di+1), card="<div class='card'><h2>"+title+" Course</h2><div class='field'><label>Course Name</label><input data-coursename='"+day+"' value='"+esc(course.name)+"' placeholder='Enter course name'></div>";
  card+="<h3 style='margin-top:16px'>Course Handicaps</h3><div class='formgrid'>";
  trip.players.forEach(function(p){card+="<div class='field'><label>"+esc(p.name)+"</label><input data-ch='"+day+"-"+p.id+"' type='number' step='1' value='"+playerCourseHcp(p.id,day)+"'></div>"});
  card+="</div><h3 style='margin-top:16px'>Hole Setup</h3><div class='scroll'><table class='score'><tr><th>Hole</th><th>Par</th><th>Hole Handicap Index</th></tr>";
  trip.holes.forEach(function(h,i){card+="<tr><td><b>"+h+"</b></td><td><input data-par='"+day+"-"+i+"' type='number' min='3' max='6' value='"+Number(course.par[i]||4)+"'></td><td><input data-si='"+day+"-"+i+"' type='number' min='1' max='18' value='"+Number(course.strokeIndex[i]||i+1)+"'></td></tr>"});
  card+="</table></div><button class='btn primary' data-save-course='"+day+"' style='margin-top:12px'>Save "+title+" Course</button></div>";
  out+=card;
});
out+="<div class='card'><h3>Scramble Handicap Formula</h3><div class='formgrid'><div class='field'><label>Lower Course HCP %</label><input id='lp' type='number' value='"+((trip.scrambleHandicap&&trip.scrambleHandicap.lowerPct)||35)+"'></div><div class='field'><label>Higher Course HCP %</label><input id='hp' type='number' value='"+((trip.scrambleHandicap&&trip.scrambleHandicap.higherPct)||15)+"'></div></div><div class='muted' style='margin-top:8px'>Day 2 scramble team handicap uses the two players' Day 2 course handicaps.</div><button class='btn' id='saveFormula' style='margin-top:12px'>Save Formula</button></div>";
out+="<div class='card'><button class='btn' id='resetScores' style='background:#fdecec;color:#a11'>Reset All Scores</button></div>";
document.getElementById("setup").innerHTML=out;
document.getElementById("saveTripName").onclick=function(){trip.tripName=document.getElementById("tn").value.trim()||"Bro-Am Live Golf";save("/api/trip",trip)};
document.getElementById("saveGolfers").onclick=function(){trip.players.forEach(function(p){p.name=document.querySelector("[data-name='"+p.id+"']").value.trim()||p.name;p.handicap=Number(document.querySelector("[data-hidx='"+p.id+"']").value)||0});save("/api/trip",trip)};
document.querySelectorAll("[data-save-course]").forEach(function(b){b.onclick=function(){var day=b.dataset.saveCourse;var course=dayCourse(day);course.name=document.querySelector("[data-coursename='"+day+"']").value.trim();course.par=trip.holes.map(function(h,i){return Number(document.querySelector("[data-par='"+day+"-"+i+"']").value)||4});course.strokeIndex=trip.holes.map(function(h,i){return Number(document.querySelector("[data-si='"+day+"-"+i+"']").value)||i+1});trip.courses[day]=course;trip.players.forEach(function(p){p.courseHandicap=p.courseHandicap||{};p.courseHandicap[day]=Number(document.querySelector("[data-ch='"+day+"-"+p.id+"']").value)||0});save("/api/trip",trip)}});
document.getElementById("saveFormula").onclick=function(){trip.scrambleHandicap={lowerPct:Number(document.getElementById("lp").value)||35,higherPct:Number(document.getElementById("hp").value)||15};save("/api/trip",trip)};
document.getElementById("resetScores").onclick=function(){if(!confirm("Reset every score?"))return;fetch("/api/reset-scores",{method:"POST"}).then(function(r){return r.json()}).then(function(x){trip=normalizeTrip(x);render()})}
}
function save(url,body){body=normalizeTrip(body);return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error("save failed");return r.json()}).then(function(x){trip=normalizeTrip(x);render();return x})}
function render(){document.getElementById("tripNameHead").textContent=trip.tripName||"Bro-Am Live Golf";renderBoard();renderScores();renderSetup();["board","scores","setup"].forEach(function(id){document.getElementById(id).hidden=id!==view});document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("active",b.dataset.view===view)})}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){view=b.dataset.view;render()}});
fetch("/api/trip",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){trip=normalizeTrip(x);render();setInterval(function(){fetch("/api/trip",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){if(x.revision!==trip.revision){trip=normalizeTrip(x);render()}})},2000)});
</script>
</body></html>
