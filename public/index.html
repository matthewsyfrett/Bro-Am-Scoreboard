<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5132">
<title>Bro-Am Live Golf</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f3f6f4;color:#17221b}
header{background:#0f5132;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}.wrap{max-width:1050px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px}.brand{font-size:28px;font-weight:900}.sub{font-size:13px;opacity:.82}.live{font-size:12px;border:1px solid #ffffff44;border-radius:99px;padding:7px 9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6cff9a;margin-right:5px}
.tabs{display:flex;gap:8px;overflow:auto;margin-top:14px}.tabs button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;background:#ffffff22;color:#fff}.tabs button.active{background:#fff;color:#0f5132}
main{padding:16px}.card{background:#fff;border:1px solid #dfe6e2;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #0000000a}h2,h3{margin-top:0}
table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid #e4e9e6;text-align:left}th:last-child,td:last-child{text-align:right}.net{font-size:18px;font-weight:900;color:#0f5132}.muted{color:#6b766f;font-size:13px}
.rounds{display:flex;flex-wrap:wrap;gap:6px}.rounds button,.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;background:#e9efeb;color:#0f5132}.rounds button.active,.primary{background:#0f5132;color:#fff}
.scroll{overflow:auto}.score{min-width:760px}.score input{width:38px;padding:7px 4px;text-align:center;border:1px solid #cfd8d3;border-radius:7px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:800;color:#6b766f;margin-bottom:4px}.field input,.field select{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cfd8d3;border-radius:8px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{background:#f7f2df;color:#604d16;border-radius:9px;padding:10px;font-size:13px;margin-top:10px}.empty{text-align:center;color:#6b766f;padding:20px}
@media(max-width:700px){.teams{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><div><div class="brand" id="tripNameHead">Bro-Am Live Golf</div><div class="sub">8 golfers · 3 days · all scoring net</div></div><div class="live"><span class="dot"></span>LIVE</div></div>
<div class="tabs"><button data-view="board" class="active">Leaderboard</button><button data-view="scores">Enter Scores</button><button data-view="setup">Trip Setup</button></div>
</div></header>
<main class="wrap"><section id="board"></section><section id="scores" hidden></section><section id="setup" hidden></section></main>
<script>
var trip=null,view="board",game="bestball";
var gameNames={bestball:"Day 1 · Best Ball",individual1:"Day 1 · Individual",scramble:"Day 2 · Scramble",individual3:"Day 3 · Individual"};
function blank(){return Array(18).fill(null)}
function player(id){return trip.players.find(function(p){return p.id===id})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;"}[c]})}
function strokesOnHole(hcp,i){var hc=Math.round(Math.max(0,Number(hcp)||0)),si=Number(trip.holeStrokeIndex&&trip.holeStrokeIndex[i]||i+1),base=Math.floor(hc/18),extra=hc%18;return base+(si<=extra?1:0)}
function netScore(gross,hcp,i){return Number(gross)-strokesOnHole(hcp,i)}
function individualTotal(id,g){var a=(trip.scores[g]&&trip.scores[g][id])||blank();if(!a.some(function(v){return v!=null}))return null;var p=player(id);return a.reduce(function(s,v,i){return s+(v==null?0:netScore(v,p.handicap,i))},0)}
function bestBallTotal(team,i){var total=0;for(var h=0;h<18;h++){var best=null;for(var j=0;j<team.length;j++){var id=team[j],a=(trip.scores.bestball&&trip.scores.bestball["team"+(i+1)+"_"+id])||blank(),v=a[h];if(v!=null){var n=netScore(v,player(id).handicap,h);if(best===null||n<best)best=n}}if(best===null)return null;total+=best}return total}
function scrambleHcp(team){var hs=team.map(function(id){return Number(player(id).handicap)||0}).sort(function(a,b){return a-b});var low=(trip.scrambleHandicap&&trip.scrambleHandicap.lowerPct)||35,high=(trip.scrambleHandicap&&trip.scrambleHandicap.higherPct)||15;return Math.round(hs[0]*low/100+hs[1]*high/100)}
function scrambleTotal(team,i){var a=(trip.scores.scramble&&trip.scores.scramble["team"+(i+1)])||blank();if(!a.some(function(v){return v!=null}))return null;var hcp=scrambleHcp(team);return a.reduce(function(s,v,h){return s+(v==null?0:netScore(v,hcp,h))},0)}
function day2HolePoints(diff){if(diff<=-2)return 3;if(diff===-1)return 2;if(diff===0)return 1;if(diff===1)return -1;return -2}
function scramblePointsTotal(team,i){var a=(trip.scores.scramble&&trip.scores.scramble["team"+(i+1)])||blank(),hcp=scrambleHcp(team),total=0,any=false;for(var h=0;h<18;h++){if(a[h]==null)continue;any=true;var par=Number(trip.holePar&&trip.holePar[h]||4),ns=netScore(a[h],hcp,h);total+=day2HolePoints(ns-par)}return any?total:null}
function leaderRows(g){var rows=[];if(g==="individual1"||g==="individual3"){rows=trip.players.map(function(p){return {id:p.id,name:p.name,h:p.handicap,score:individualTotal(p.id,g)}})}else{var ts=trip.teams[g==="bestball"?"bestball":"scramble"];rows=ts.map(function(t,i){return {team:t,name:t.map(function(id){return player(id).name}).join(" / "),score:g==="bestball"?bestBallTotal(t,i):scrambleTotal(t,i),points:g==="scramble"?scramblePointsTotal(t,i):null}})}return rows}
function placementPoints(g,i){if(g==="bestball")return [10,8,6,4][i]||0;if(g==="individual1")return [14,12,10,8,6,4,2,0][i]||0;return 0}
function overallRows(){var out=trip.players.map(function(p){return {id:p.id,name:p.name,points:0}}),m={};out.forEach(function(x){m[x.id]=x});
var b=leaderRows("bestball"),bDone=b.every(function(r){return r.score!=null});if(bDone)b.slice().sort(function(a,c){return a.score-c.score}).forEach(function(r,i){r.team.forEach(function(id){m[id].points+=placementPoints("bestball",i)})});
var i1=leaderRows("individual1"),iDone=i1.every(function(r){return r.score!=null});if(iDone)i1.slice().sort(function(a,c){return a.score-c.score}).forEach(function(r,i){m[r.id].points+=placementPoints("individual1",i)});
leaderRows("scramble").forEach(function(r){if(r.points!=null)r.team.forEach(function(id){m[id].points+=r.points})});
return out.sort(function(a,b){return b.points-a.points||a.name.localeCompare(b.name)})}
function renderBoard(){var out="<div class='card'><h2>Overall Trip Points</h2><div class='muted'>Best Ball and Day 1 Individual points are awarded when the game is complete. Day 2 scramble points update hole-by-hole.</div><table><tr><th>#</th><th>Golfer</th><th>Points</th></tr>";overallRows().forEach(function(r,i){out+="<tr><td>"+(i+1)+"</td><td><b>"+esc(r.name)+"</b></td><td class='net'>"+r.points+"</td></tr>"});out+="</table></div>";
Object.keys(gameNames).forEach(function(g){var rows=leaderRows(g),has=rows.some(function(r){return r.score!=null||r.points!=null});var done=rows.every(function(r){return r.score!=null});if(g==="scramble")rows.sort(function(a,b){return (b.points==null?-999:b.points)-(a.points==null?-999:a.points)});
else rows.sort(function(a,b){return (a.score==null?999:a.score)-(b.score==null?999:b.score)});
var ptsText=g==="bestball"?"1st 10 · 2nd 8 · 3rd 6 · 4th 4":g==="individual1"?"14 / 12 / 10 / 8 / 6 / 4 / 2 / 0":"Eagle 3 · Birdie 2 · Par 1 · Bogey −1 · Double Bogey −2";
out+="<div class='card'><h2>"+gameNames[g]+"</h2><div class='muted'>Net scoring · "+ptsText+"</div>";if(!has){out+="<div class='empty'>No scores entered yet.</div>"}else{out+="<table><tr><th>#</th><th>Player / Team</th><th>Net</th><th>Points</th></tr>";rows.forEach(function(r,i){var pts=g==="scramble"?r.points:(done?placementPoints(g,i):null);out+="<tr><td>"+(i+1)+"</td><td><b>"+esc(r.name)+"</b>"+(r.h==null?"":" · HCP "+r.h)+"</td><td class='net'>"+(r.score==null?"—":r.score)+"</td><td class='net'>"+(pts==null?"—":pts)+"</td></tr>"});out+="</table>";if(g==="scramble")out+="<div class='notice'>Day 2 points are cumulative by hole from each team's net score versus par. The team points are credited to both golfers.</div>";else if((g==="bestball"||g==="individual1")&&!done)out+="<div class='notice'>Game points lock in after all players/teams complete 18 holes.</div>";if(g==="individual3")out+="<div class='notice'>Day 3 points have not been configured yet.</div>"}out+="</div>"});document.getElementById("board").innerHTML=out}
function scoreRow(key,label,g){var a=(trip.scores[g]&&trip.scores[g][key])||blank(),out="<div class='card'><h3>"+esc(label)+"</h3><div class='scroll'><table class='score'><tr><th>Gross</th>";trip.holes.forEach(function(h){out+="<th>"+h+"</th>"});out+="</tr><tr><td>Score</td>";trip.holes.forEach(function(h,i){out+="<td><input type='number' min='1' max='20' inputmode='numeric' data-g='"+g+"' data-k='"+key+"' data-i='"+i+"' value='"+(a[i]==null?"":a[i])+"'></td>"});out+="</tr></table></div></div>";return out}
function renderScores(){var out="<div class='card'><h2>Enter Scores</h2><div class='rounds'>";Object.keys(gameNames).forEach(function(g){out+="<button class='"+(g===game?"active":"")+"' data-game='"+g+"'>"+gameNames[g]+"</button>"});out+="</div><div class='muted' style='margin-top:8px'>Enter gross scores. Net scores and points update live.</div></div>";
if(game==="individual1"||game==="individual3"){trip.players.forEach(function(p){out+=scoreRow(p.id,p.name+" · HCP "+p.handicap,game)})}
else if(game==="bestball"){trip.teams.bestball.forEach(function(t,i){out+="<div class='card'><h3>Team "+(i+1)+" · "+esc(t.map(function(id){return player(id).name}).join(" / "))+"</h3>";t.forEach(function(id){out+=scoreRow("team"+(i+1)+"_"+id,player(id).name+" · HCP "+player(id).handicap,"bestball")});out+="</div>"})}
else{trip.teams.scramble.forEach(function(t,i){out+="<div class='card'><h3>Team "+(i+1)+" · "+esc(t.map(function(id){return player(id).name}).join(" / "))+" · Team HCP "+scrambleHcp(t)+"</h3>"+scoreRow("team"+(i+1),t.map(function(id){return player(id).name}).join(" / "),"scramble")+"</div>"})}
document.getElementById("scores").innerHTML=out;document.querySelectorAll("#scores .rounds button").forEach(function(b){b.onclick=function(){game=b.dataset.game;render()}});document.querySelectorAll("#scores input[data-i]").forEach(function(el){el.onchange=function(){var g=el.dataset.g,k=el.dataset.k,i=Number(el.dataset.i);trip.scores[g]=trip.scores[g]||{};var a=trip.scores[g][k]||blank();a[i]=el.value===""?null:Number(el.value);save("/api/scores",{game:g,key:k,holes:a})}})}
function teamEditor(kind){var out="<div class='teams'>";trip.teams[kind].forEach(function(t,i){out+="<div class='card'><b>Team "+(i+1)+"</b><div class='formgrid'>";[0,1].forEach(function(j){out+="<div class='field'><label>Golfer "+(j+1)+"</label><select data-team='"+kind+"' data-i='"+i+"' data-j='"+j+"'>"+trip.players.map(function(p){return "<option value='"+p.id+"' "+(p.id===t[j]?"selected":"")+">"+esc(p.name)+"</option>"}).join("")+"</select></div>"});out+="</div></div>"});return out+"</div><button class='btn' data-save-team='"+kind+"'>Save Teams</button>"}
function renderSetup(){var out="<div class='card'><h2>Trip Setup</h2><div class='field'><label>Trip name</label><input id='tn' value='"+esc(trip.tripName)+"'></div><h3>Golfers</h3><div class='formgrid'>";trip.players.forEach(function(p){out+="<div class='field'><label>Name</label><input data-name='"+p.id+"' value='"+esc(p.name)+"'></div><div class='field'><label>Course handicap</label><input data-hcp='"+p.id+"' type='number' step='.1' value='"+p.handicap+"'></div>"});out+="</div><button class='btn primary' id='savePlayers' style='margin-top:12px'>Save Trip & Golfers</button></div>";
out+="<div class='card'><h3>Best Ball Teams</h3>"+teamEditor("bestball")+"</div><div class='card'><h3>Scramble Teams</h3>"+teamEditor("scramble")+"</div>";
out+="<div class='card'><h3>Course Stroke Index</h3><div class='formgrid'>";trip.holes.forEach(function(h,i){out+="<div class='field'><label>Hole "+h+"</label><input data-si='"+i+"' type='number' min='1' max='18' value='"+trip.holeStrokeIndex[i]+"'></div>"});out+="</div><button class='btn' id='saveSI'>Save Stroke Index</button></div>";
out+="<div class='card'><h3>Hole Par</h3><div class='muted'>Day 2 points use net score versus par. Set these to the actual course pars.</div><div class='formgrid'>";trip.holes.forEach(function(h,i){out+="<div class='field'><label>Hole "+h+"</label><input data-par='"+i+"' type='number' min='3' max='6' value='"+((trip.holePar&&trip.holePar[i])||4)+"'></div>"});out+="</div><button class='btn' id='savePars'>Save Hole Pars</button></div>";
out+="<div class='card'><h3>Scramble Handicap Formula</h3><div class='formgrid'><div class='field'><label>Lower HCP %</label><input id='lp' type='number' value='"+((trip.scrambleHandicap&&trip.scrambleHandicap.lowerPct)||35)+"'></div><div class='field'><label>Higher HCP %</label><input id='hp' type='number' value='"+((trip.scrambleHandicap&&trip.scrambleHandicap.higherPct)||15)+"'></div></div><button class='btn' id='saveFormula'>Save Formula</button></div>";
out+="<div class='card'><button class='btn' id='resetScores' style='background:#fdecec;color:#a11'>Reset All Scores</button></div>";document.getElementById("setup").innerHTML=out;
document.getElementById("savePlayers").onclick=function(){trip.tripName=document.getElementById("tn").value.trim()||"Bro-Am Live Golf";trip.players.forEach(function(p){p.name=document.querySelector("[data-name='"+p.id+"']").value.trim()||p.name;p.handicap=Number(document.querySelector("[data-hcp='"+p.id+"']").value)||0});save("/api/trip",trip)};
document.querySelectorAll("[data-save-team]").forEach(function(b){b.onclick=function(){var kind=b.dataset.saveTeam;document.querySelectorAll("[data-team='"+kind+"']").forEach(function(s){trip.teams[kind][Number(s.dataset.i)][Number(s.dataset.j)]=s.value});save("/api/trip",trip)}});
document.getElementById("saveSI").onclick=function(){trip.holeStrokeIndex=trip.holes.map(function(h,i){return Number(document.querySelector("[data-si='"+i+"']").value)||i+1});save("/api/trip",trip)};
document.getElementById("savePars").onclick=function(){trip.holePar=trip.holes.map(function(h,i){return Number(document.querySelector("[data-par='"+i+"']").value)||4});save("/api/trip",trip)};
document.getElementById("saveFormula").onclick=function(){trip.scrambleHandicap={lowerPct:Number(document.getElementById("lp").value)||35,higherPct:Number(document.getElementById("hp").value)||15};save("/api/trip",trip)};
document.getElementById("resetScores").onclick=function(){if(!confirm("Reset every score?"))return;fetch("/api/reset-scores",{method:"POST"}).then(function(r){return r.json()}).then(function(x){trip=x;render()})}}
function save(url,body){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error("save failed");return r.json()}).then(function(x){trip=x;render();return x})}
function render(){document.getElementById("tripNameHead").textContent=trip.tripName||"Bro-Am Live Golf";renderBoard();renderScores();renderSetup();["board","scores","setup"].forEach(function(id){document.getElementById(id).hidden=id!==view});document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("active",b.dataset.view===view)})}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){view=b.dataset.view;render()}});
fetch("/api/trip",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){trip=x;render();setInterval(function(){fetch("/api/trip",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){if(x.revision!==trip.revision){trip=x;render()}})},2000)});
</script>
</body></html>
