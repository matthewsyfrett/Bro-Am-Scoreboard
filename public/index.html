<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5132"><title>Bro-Am Live Golf</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f3f6f4;color:#17221b}
header{background:#0f5132;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:2}
.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.brand{font-size:27px;font-weight:900}.sub{opacity:.82;font-size:13px}
.tabs{display:flex;gap:8px;overflow:auto;margin-top:14px}.tabs button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;background:#ffffff22;color:#fff}.tabs button.active{background:#fff;color:#0f5132}
main{padding:16px}.card{background:#fff;border:1px solid #dfe6e2;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #0000000a}
h2{margin:0 0 8px}.muted{color:#6b766f;font-size:13px}.live{font-size:12px;border:1px solid #ffffff44;border-radius:99px;padding:7px 9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6cff9a;margin-right:5px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid #e4e9e6;text-align:left}th:last-child,td:last-child{text-align:right}.net{font-size:18px;font-weight:900;color:#0f5132}.pill{font-size:11px;background:#edf3ef;border-radius:99px;padding:3px 7px;margin-left:5px}
.empty{text-align:center;color:#6b766f;padding:20px}.rounds{display:flex;flex-wrap:wrap;gap:6px}.rounds button,.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;background:#e9efeb;color:#0f5132}.rounds button.active,.primary{background:#0f5132;color:#fff}
.scroll{overflow:auto}.score{min-width:770px}.score input{width:38px;padding:7px 4px;text-align:center;border:1px solid #cfd8d3;border-radius:7px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:800;color:#6b766f;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cfd8d3;border-radius:8px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.teams{grid-template-columns:1fr}}
.notice{background:#f7f2df;color:#604d16;border-radius:9px;padding:10px;font-size:13px;margin-top:10px}
.savebar{position:sticky;bottom:10px;background:#fff;border:1px solid #dfe6e2;border-radius:12px;padding:10px;margin-top:12px;text-align:center;box-shadow:0 3px 14px #0001}
</style></head>
<body><header><div class="wrap"><div class="top"><div><div class="brand" id="tripNameHead">Bro-Am Live Golf</div><div class="sub">8 golfers · 3 days · net scoring</div></div><div class="live"><span class="dot"></span>LIVE</div></div>
<div class="tabs"><button data-view="board" class="active">Leaderboard</button><button data-view="scores">Enter Scores</button><button data-view="setup">Trip Setup</button></div></div></header>
<main class="wrap"><section id="board"></section><section id="scores" hidden></section><section id="setup" hidden></section></main>
<script>
var trip=null,view="board",game="bestball";
var gameNames={bestball:"Day 1 · Best Ball",individual1:"Day 1 · Individual",scramble:"Day 2 · Scramble",individual3:"Day 3 · Individual"};
function blank(){return Array(18).fill(null)}
function player(id){return trip.players.find(function(p){return p.id===id})}
function netScore(g,h,n){var base=Math.floor(Math.max(0,h)/18),extra=Math.max(0,h)%18;return Number(g)-(base+(n<=extra?1:0))}
function individualTotal(id,g){var a=(trip.scores[g]&&trip.scores[g][id])||[];if(!a.some(function(v){return v!=null}))return null;var p=player(id);return a.reduce(function(s,v,i){return s+(v==null?0:netScore(v,p.handicap,i+1))},0)}
function bestBallTotal(team,i){var total=0,any=false;for(var h=0;h<18;h++){var best=null;for(var j=0;j<team.length;j++){var id=team[j],a=(trip.scores.bestball&&trip.scores.bestball["team"+(i+1)+"_"+id])||[],v=a[h];if(v!=null){any=true;var n=netScore(v,player(id).handicap,h+1);if(best===null||n<best)best=n}}if(best===null)return null;total+=best}return any?total:null}
function scrambleHcp(team){var hs=team.map(function(id){return player(id).handicap}).sort(function(a,b){return a-b});return Math.round(hs[0]*((trip.scrambleHandicap&&trip.scrambleHandicap.lowerPct)||35)/100+hs[1]*((trip.scrambleHandicap&&trip.scrambleHandicap.higherPct)||15)/100)}
function scrambleTotal(team,i){var a=(trip.scores.scramble&&trip.scores.scramble["team"+(i+1)])||[];if(!a.length||a.some(function(v){return v==null}))return null;var hcp=scrambleHcp(team);return a.reduce(function(s,v,h){return s+netScore(v,hcp,h+1)},0)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]})}
function leaderRows(g){var rows=[];if(g==="individual1"||g==="individual3"){rows=trip.players.map(function(p){return {name:p.name,id:p.id,h:p.handicap,score:individualTotal(p.id,g)}})}else{var teams=trip.teams[g==="bestball"?"bestball":"scramble"];rows=teams.map(function(t,i){return {name:t.map(function(id){return player(id).name}).join(" / "),team:t,score:g==="bestball"?bestBallTotal(t,i):scrambleTotal(t,i)}})}rows.sort(function(a,b){var x=a.score==null?999:a.score,y=b.score==null?999:b.score;return x-y});return rows}
function pointsFor(g,place,completed){if(!completed)return null;if(g==="bestball"){return [10,8,6,4][place]||0}if(g==="individual1"){return [14,12,10,8,6,4,2,0][place]||0}return null}
function overallRows(){var totals=trip.players.map(function(p){return {id:p.id,name:p.name,points:0}});var byId={};totals.forEach(function(x){byId[x.id]=x});
var br=leaderRows("bestball");br.forEach(function(r,i){if(r.score!=null){var pts=pointsFor("bestball",i,true)||0;r.team.forEach(function(id){byId[id].points+=pts})}});
var ir=leaderRows("individual1");ir.forEach(function(r,i){if(r.score!=null){byId[r.id].points+=pointsFor("individual1",i,true)||0}});
totals.sort(function(a,b){return b.points-a.points||a.name.localeCompare(b.name)});return totals}
function renderBoard(){var out="<div class='card'><h2>Overall Trip Points</h2><div class='muted'>Points earned so far. Day 2 and Day 3 points are not configured yet.</div><table><tr><th>#</th><th>Golfer</th><th>Points</th></tr>";
overallRows().forEach(function(r,i){out+="<tr><td>"+(i+1)+"</td><td><b>"+esc(r.name)+"</b></td><td class='net'>"+r.points+"</td></tr>"});
out+="</table></div>";
Object.keys(gameNames).forEach(function(g){var rows=leaderRows(g),done=rows.length>0&&rows.every(function(r){return r.score!=null}),hasAny=rows.some(function(r){return r.score!=null});out+="<div class='card'><h2>"+gameNames[g]+"</h2><div class='muted'>Net score"+(g==="bestball"?" · 1st 10 pts · 2nd 8 pts · 3rd 6 pts · 4th 4 pts":"")+(g==="individual1"?" · 14 / 12 / 10 / 8 / 6 / 4 / 2 / 0 pts":"")+"</div>";
if(!hasAny){out+="<div class='empty'>No scores entered yet.</div>"}else{out+="<table><tr><th>#</th><th>Player / Team</th><th>Net</th><th>Points</th></tr>";rows.forEach(function(r,i){var pts=pointsFor(g,i,done);out+="<tr><td>"+(i+1)+"</td><td><b>"+esc(r.name)+"</b>"+(r.h==null?"":" <span class='pill'>HCP "+r.h+"</span>")+"</td><td class='net'>"+(r.score==null?"—":r.score)+"</td><td class='net'>"+(pts==null?"—":pts)+"</td></tr>"});out+="</table>";if((g==="individual1"||g==="bestball")&&!done){out+="<div class='notice'>Game points lock in when every player/team has a completed 18-hole score.</div>"}if(g==="scramble"||g==="individual3"){out+="<div class='notice'>Points for this game have not been configured yet.</div>"}}out+="</div>"});document.getElementById("board").innerHTML=out}
function scoreRow(key,label,g){var a=(trip.scores[g]&&trip.scores[g][key])||blank(),out="<div class='card'><h3>"+esc(label)+"</h3><div class='scroll'><table class='score'><tr><th>Gross</th>";trip.holes.forEach(function(h){out+="<th>"+h+"</th>"});out+="</tr><tr><td>Score</td>";trip.holes.forEach(function(h,i){out+="<td><input type='number' min='1' max='20' inputmode='numeric' data-g='"+g+"' data-k='"+key+"' data-i='"+i+"' value='"+(a[i]==null?"":a[i])+"'></td>"});out+="</tr></table></div></div>";return out}
function renderScores(){var out="<div class='card'><h2>Enter Scores</h2><div class='rounds'>";Object.keys(gameNames).forEach(function(g){out+="<button class='"+(g===game?"active":"")+"' onclick="game='"+g+"';renderScores()">"+gameNames[g]+"</button>"});out+="</div><div class='muted' style='margin-top:8px'>Enter gross scores. Net standings update automatically for everyone viewing the site.</div></div>";
if(game==="individual1"||game==="individual3"){trip.players.forEach(function(p){out+=scoreRow(p.id,p.name+" · HCP "+p.handicap,game)})}
else if(game==="bestball"){trip.teams.bestball.forEach(function(t,i){out+="<div class='card'><h3>Team "+(i+1)+" · "+esc(t.map(function(id){return player(id).name}).join(" / "))+"</h3>";t.forEach(function(id){out+=scoreRow("team"+(i+1)+"_"+id,player(id).name+" · HCP "+player(id).handicap,"bestball")});out+="<div class='notice'>The lower net score counts for the team on each hole.</div></div>"})}
else{trip.teams.scramble.forEach(function(t,i){out+="<div class='card'><h3>Team "+(i+1)+" · "+esc(t.map(function(id){return player(id).name}).join(" / "))+"</h3><div class='muted'>Team handicap: "+scrambleHcp(t)+"</div>";out+=scoreRow("team"+(i+1),t.map(function(id){return player(id).name}).join(" / "),"scramble");out+="</div>"})}
document.getElementById("scores").innerHTML=out;document.querySelectorAll("#scores input[data-i]").forEach(function(el){el.onchange=function(){var g=el.dataset.g,k=el.dataset.k,i=Number(el.dataset.i);trip.scores[g]=trip.scores[g]||{};var a=trip.scores[g][k]||blank();a[i]=el.value===""?null:Number(el.value);post("/api/scores",{game:g,key:k,holes:a})}})}
function renderSetup(){var out="<div class='card'><h2>Trip Setup</h2><div class='field'><label>Trip name</label><input id='tn' value='"+esc(trip.tripName)+"'></div><h3>Golfers</h3><div class='formgrid'>";trip.players.forEach(function(p){out+="<div class='field'><label>Name</label><input data-name='"+p.id+"' value='"+esc(p.name)+"'></div><div class='field'><label>Course handicap</label><input data-hcp='"+p.id+"' type='number' step='.1' value='"+p.handicap+"'></div>"});out+="</div><button class='btn primary' onclick='savePlayers()' style='margin-top:12px'>Save Trip & Golfers</button></div>";
out+="<div class='card'><h3>Best Ball Teams</h3>"+teamEditor("bestball")+"</div><div class='card'><h3>Scramble Teams</h3>"+teamEditor("scramble")+"</div>";
out+="<div class='card'><h3>Course Stroke Index</h3><div class='formgrid'>";trip.holes.forEach(function(h,i){out+="<div class='field'><label>Hole "+h+"</label><input data-si='"+i+"' type='number' min='1' max='18' value='"+trip.holeStrokeIndex[i]+"'></div>"});out+="</div><button class='btn' onclick='saveSI()' style='margin-top:12px'>Save Stroke Index</button></div>";
out+="<div class='card'><h3>Scramble Handicap Formula</h3><div class='formgrid'><div class='field'><label>Lower HCP %</label><input id='lp' type='number' value='"+((trip.scrambleHandicap&&trip.scrambleHandicap.lowerPct)||35)+"'></div><div class='field'><label>Higher HCP %</label><input id='hp' type='number' value='"+((trip.scrambleHandicap&&trip.scrambleHandicap.higherPct)||15)+"'></div></div><button class='btn' onclick='saveFormula()' style='margin-top:12px'>Save Formula</button></div>";
out+="<div class='card'><button class='btn' style='background:#fdecec;color:#a11' onclick='resetScores()'>Reset All Scores</button></div>";
document.getElementById("setup").innerHTML=out}
function teamEditor(kind){var ts=trip.teams[kind],out="<div class='teams'>";ts.forEach(function(t,i){out+="<div class='card'><b>Team "+(i+1)+"</b><div class='formgrid'>";[0,1].forEach(function(j){out+="<div class='field'><label>Golfer "+(j+1)+"</label><select data-team='"+kind+"' data-i='"+i+"' data-j='"+j+"'>"+trip.players.map(function(p){return "<option value='"+p.id+"' "+(p.id===t[j]?"selected":"")+">"+esc(p.name)+"</option>"}).join("")+"</select></div>"});out+="</div></div>"});return out+"</div><button class='btn' onclick="saveTeams('"+kind+"')">Save Teams</button>"}
function post(url,body){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error("save failed");return r.json()}).then(function(x){trip=x;render();return x})}
function savePlayers(){trip.tripName=document.getElementById("tn").value.trim()||"Bro-Am Live Golf";trip.players.forEach(function(p){p.name=document.querySelector("[data-name='"+p.id+"']").value.trim()||p.name;p.handicap=Number(document.querySelector("[data-hcp='"+p.id+"']").value)||0});post("/api/trip",trip)}
function saveTeams(kind){document.querySelectorAll("[data-team='"+kind+"']").forEach(function(s){trip.teams[kind][Number(s.dataset.i)][Number(s.dataset.j)]=s.value});post("/api/trip",trip)}
function saveSI(){trip.holeStrokeIndex=trip.holes.map(function(h,i){return Number(document.querySelector("[data-si='"+i+"']").value)||i+1});post("/api/trip",trip)}
function saveFormula(){trip.scrambleHandicap={lowerPct:Number(document.getElementById("lp").value)||35,higherPct:Number(document.getElementById("hp").value)||15};post("/api/trip",trip)}
function resetScores(){if(!confirm("Reset every score on the trip?"))return;fetch("/api/reset-scores",{method:"POST"}).then(function(r){return r.json()}).then(function(x){trip=x;render()})}
function render(){document.getElementById("tripNameHead").textContent=trip.tripName||"Bro-Am Live Golf";renderBoard();renderScores();renderSetup();["board","scores","setup"].forEach(function(id){document.getElementById(id).hidden=id!==view});document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("active",b.dataset.view===view)})}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){view=b.dataset.view;render()}});
fetch("/api/trip",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){trip=x;render();setInterval(function(){fetch("/api/trip",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){if(x.revision!==trip.revision){trip=x;render()}})},2000)});
</script></body></html>
